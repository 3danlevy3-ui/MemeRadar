name: MemeRadar scan

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min, 24/7 (GitHub may delay runs by a few minutes)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram test message only"
        type: boolean
        default: false

concurrency:
  group: memeradar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_DAILY_BUDGET: ${{ vars.X_DAILY_BUDGET }}
          X_WATCHLIST: ${{ vars.X_WATCHLIST }}
          X_ACCOUNTS: ${{ vars.X_ACCOUNTS }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MIN_MENTIONS_1H: ${{ vars.MIN_MENTIONS_1H }}
          MIN_AUTHORS_1H: ${{ vars.MIN_AUTHORS_1H }}
          BURST_MULT: ${{ vars.BURST_MULT }}
          EARLY_MAX_MOVE: ${{ vars.EARLY_MAX_MOVE }}
          SUBREDDITS: ${{ vars.SUBREDDITS }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python -m scanner.main --test-telegram
          else
            python -m scanner.main -v
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "memeradar-bot"
          git config user.email "memeradar-bot@users.noreply.github.com"
          git add state/ docs/ || true
          git diff --cached --quiet && exit 0
          git commit -m "state update [skip ci]"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done
